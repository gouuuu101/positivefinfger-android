name: Android APK
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug --continue --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PositiveFinger-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Save verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification-reports
          path: |
            app/build/reports/lint-results-debug.*
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
